services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - school-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_erp"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - school-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  school-postgres:
  school-mongo:
